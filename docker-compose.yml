version: '3.8'
services:
  mongo:
    image: mongo:latest
    container_name: devmanager_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

  redis:
    image: redis:alpine
    container_name: devmanager_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: devmanager_app
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - MONGO_URI=mongodb://admin:password123@mongo:27017/devmanager?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretkey
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
