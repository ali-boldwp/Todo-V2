version: '3.8'
services:
  mongo:
    image: mongo:latest
    container_name: devmanager_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

  redis:
    image: redis:alpine
    container_name: devmanager_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
