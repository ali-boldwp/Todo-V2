services:
  mongo:
    image: mongo:7
    container_name: devmanager_mongo_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data_dev:/data/db

  redis:
    image: redis:7-alpine
    container_name: devmanager_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: devmanager_api_dev
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace=apps/api"
    env_file:
      - ./api.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3030:3030"
    volumes:
      - ..:/workspace
      - api_node_modules_dev:/workspace/node_modules
    depends_on:
      - mongo
      - redis

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: devmanager_web_dev
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace=apps/web -- --host 0.0.0.0 --port 3000"
    env_file:
      - ./web.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace
      - web_node_modules_dev:/workspace/node_modules
    depends_on:
      - api

volumes:
  mongo_data_dev:
  redis_data_dev:
  api_node_modules_dev:
  web_node_modules_dev:
